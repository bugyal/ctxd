[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxd"
version = "0.1.0"
description = "Agent stale-context detection: ground-truth context ledger, stale file-view detection, pre-flight gating"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "bugyal coding" }]
keywords = ["agents", "context-window", "claude-code", "harness", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ctxd = "ctxd.cli:main"

[project.urls]
Homepage = "https://github.com/bugyal/ctxd"

[tool.setuptools.packages.find]
where = ["src"]
